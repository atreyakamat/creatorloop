# Netlify picks up Next.js automatically; this pins the build so deploys are repeatable.
# Do not set a publish directory: Netlify's Next.js adapter configures it.
[build]
  command = "bash netlify-debug-build.sh"

# Required so Netlify runs the build through its Next.js adapter
# (without it, only static files get published and every route 404s).
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* values are inlined into the page by design (the Supabase
  # publishable key is a public, client-side key). This exempts only these
  # named keys from Netlify's secret scanning; real secrets are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_WHATSAPP_NUMBER,NEXT_PUBLIC_UPI_ID,NEXT_PUBLIC_UPI_NAME,NEXT_PUBLIC_CONTACT_EMAIL,NEXT_PUBLIC_LANDING_ONLY"
  # This branch serves only the marketing page + waitlist. Delete this line
  # (or deploy main instead) when the app opens.
  NEXT_PUBLIC_LANDING_ONLY = "1"
