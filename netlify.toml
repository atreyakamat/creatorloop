# Netlify picks up Next.js automatically; this pins the build so deploys are repeatable.
# Do not set a publish directory: Netlify's Next.js adapter configures it.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # This branch serves only the marketing page + waitlist. Delete this line
  # (or deploy main instead) when the app opens.
  NEXT_PUBLIC_LANDING_ONLY = "1"
